<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3>inline</h3>
    <button id="btn1" onclick="alert('this is buttton 1')">Click me</button>
    <hr>
    <hr>
    <hr>
    <hr>
    <hr>
    <h3>dom event handler</h3>
    <button id="btn2">Click me</button>
    <hr>
    <hr>
    <hr>
    <hr>
    <hr>
    <h3>addEventListener</h3>
    <button id="btn3">Click me</button>

    <script>
        document.getElementById("btn2").onmouseover=()=>{alert("this is button 2")}

        document.getElementById("btn3").addEventListener("dblclick",()=>{
            alert("button 3")
        })
    </script>
</body>
</html>
