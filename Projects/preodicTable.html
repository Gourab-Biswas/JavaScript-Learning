<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PREODIC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
        
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }
        
        html,
        body {
          width: 100%;
          height: 100vh;
          background-color: #FFFFF0;
          font-family: 'Poppins', sans-serif;
        }
        .container{
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            text-align: center;
            /* align-items: center; */
            /* background-color: aqua; */
        }
        
        .maindiv{
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(10,1fr);
            gap: 10px;
            padding: 10px;
        }

        .element{
            height: 100px;
            width: 100%;
            border: 2px solid blue;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
        }
        
        
    </style>
</head>
<body>
    <div class="container">
        <h1>Event Delegation - Preodic Table</h1>
        <div class="maindiv">
        </div>
    </div>

    <script>

        let maindiv = document.querySelector(".maindiv")

        let createElement = (symbol,enumber,ename)=>{
            let element = document.createElement("div");
            element.classList.add("element")
            element.innerText = symbol;
            element.setAttribute("data-number",enumber)
            element.setAttribute("data-name",ename)
            return element
        }

        let handelEvent = (e)=>{
            if(e.target.classList.contains("element")){
                let number = e.target.getAttribute("data-number")
                let name = e.target.getAttribute("data-name")
                alert(`Atomic Number : ${number}\nElement Name   : ${name}`)
            }
        }
        maindiv.addEventListener("click",handelEvent)


        let initial = ()=>{
            for(let i = 1; i<=50; i++){
                let element = createElement(`E-${i}`,i,`Element ${i}`)
                maindiv.append(element)
            }
        }
        initial()
    </script>
</body>
</html>
